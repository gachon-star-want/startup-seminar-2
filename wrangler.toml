name = "startup-seminar-2"
main = "./workers/app.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./build/client"

[[r2_buckets]]
binding = "FILES"
bucket_name = "seminar-files"

# Worker와 같은 위치에서 도는 SQLite — 네트워크 왕복/콜드스타트 없음
[[d1_databases]]
binding = "DB"
database_name = "startup-seminar-2"
database_id = "585367e4-623b-43a3-853d-7588e7db6f4a"
migrations_dir = "drizzle"
